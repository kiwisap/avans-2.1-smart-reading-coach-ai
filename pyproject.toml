[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-reading-coach-ai"
version = "1.0.0"
description = "AI prototype voor Vrij lezen op maat: leesadvies met uitleg"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "nltk>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "seaborn>=0.13", "umap-learn>=0.5"]
dev = ["pytest>=8", "httpx2>=2.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
